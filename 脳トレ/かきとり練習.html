<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>かきとり練習</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
/* 1画面1つのこと。大きな文字、大きなボタン、スクロールなし(横向きでも)。高コントラストのため配色は固定 */
:root{--bg:#fbfaf5;--ink:#111;--line:#333;--blue:#0b4f9c;--soft:#e6eef8;--guide:#c9c9c9;--red:#c62828;
--kyo:"Klee One","Klee","Hiragino Maru Gothic ProN",sans-serif;--ui:"Hiragino Sans","Noto Sans JP",sans-serif;color-scheme:light}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{height:100%;display:flex;flex-direction:column;padding:12px 16px;gap:12px}
button{font:700 clamp(20px,3.6vmin,34px)/1.25 var(--ui);border:3px solid var(--blue);background:#fff;color:var(--blue);border-radius:18px;min-height:64px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active{background:var(--soft)}
button:focus-visible{outline:5px solid #f2a900}
button.main{background:var(--blue);color:#fff}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:clamp(24px,4.6vmin,44px);text-align:center;flex:1}
.grid{flex:1;min-height:0;display:grid;gap:14px;grid-auto-rows:1fr}
.grid button{font-family:var(--kyo);font-size:clamp(26px,6vmin,60px);color:var(--ink);padding:4px}
.grid button small{display:block;font:700 .45em var(--ui);color:var(--blue)}
.home{grid-template-columns:1fr 1fr}
.rows{grid-template-columns:1fr 1fr}
@media (orientation:landscape){.home{grid-template-columns:repeat(3,1fr)}.rows{grid-template-columns:repeat(4,1fr)}}
.work{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
@media (orientation:landscape){.work{flex-direction:row}.side{width:34%}}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.model{font:600 clamp(80px,17vmin,200px)/1.15 var(--kyo)}
.yomi{font-size:clamp(24px,4vmin,40px);font-weight:700;text-align:center}
.word{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;font:600 clamp(24px,4vmin,38px) var(--kyo)}
.word span{padding:0 4px;border-bottom:6px solid transparent}
.word span.now{border-color:var(--red);background:var(--soft)}
.stage{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.paper{position:relative;background:#fff;border:4px solid var(--line);border-radius:8px}
.paper::before,.paper::after{content:"";position:absolute;pointer-events:none}
.paper::before{left:50%;top:0;bottom:0;border-left:3px dashed var(--guide)}
.paper::after{top:50%;left:0;right:0;border-top:3px dashed var(--guide)}
#trace{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--kyo);font-weight:600;color:#d4d4d4;line-height:1;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
#maru{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:var(--red);font:700 clamp(30px,7vmin,70px) var(--ui)}
#maru svg{width:80%;height:70%}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bar button{min-height:clamp(72px,11vmin,110px)}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.family{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;flex:1;font-size:22px}
.family input{font-size:24px;padding:12px;border:2px solid var(--line);border-radius:10px;width:100%;-webkit-user-select:text;user-select:text;background:#fff;color:var(--ink)}
.family .item{display:flex;justify-content:space-between;align-items:center;gap:12px}
</style>
<div id="app" lang="ja"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const cfg=Object.assign({trace:true,slow:true},store.get('kk-cfg',{}));
let mine=store.get('kk-words',[]);

/* 読み上げ */
function say(t){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=cfg.slow?0.7:0.95;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-')==='ja-JP');if(v)u.voice=v;
  speechSynthesis.speak(u);
}
/* 「は」「へ」を助詞の読み(わ・え)にしないため、カタカナで読ませる */
const kana=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));

/* 教材: 各項目は {w:書く文字, y:読み} */
const ch=s=>[...s].map(c=>({w:c,y:c}));
const pairs=s=>s.split(' ').map(p=>{const[w,y]=p.split(':');return{w,y}});
const hira=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','やゆよ','らりるれろ','わをん'];
const kata=hira.map(kana);
const nums=['ぜろ','いち','に','さん','よん','ご','ろく','なな','はち','きゅう','じゅう'].map((y,i)=>({w:String(i),y}));
const kanji={
 'かず':pairs('一:いち 二:に 三:さん 四:よん 五:ご 六:ろく 七:なな 八:はち 九:きゅう 十:じゅう'),
 'しぜん':pairs('日:ひ 月:つき 火:ひ 水:みず 木:き 土:つち 山:やま 川:かわ 空:そら 雨:あめ 花:はな'),
 'ひと・からだ':pairs('人:ひと 子:こ 女:おんな 男:おとこ 目:め 耳:みみ 口:くち 手:て 足:あし'),
 'ようす':pairs('大:おおきい 中:なか 小:ちいさい 上:うえ 下:した 左:ひだり 右:みぎ 白:しろ 赤:あか 青:あお')
};
const words=['ありがとう','おはよう','おやすみ','いただきます','無理せずいこうね'].map(w=>({w,y:w==='無理せずいこうね'?'むりせず、いこうね':w}));

const el=(h)=>{app.innerHTML=h};
const on=(s,f)=>{$(s).onclick=f};
function menu(title,items,back,cls){
  el(`<div class="top">${back?'<button id="back">← もどる</button>':''}<h1>${title}</h1><button id="read">🔊 きく</button></div><div class="grid ${cls}"></div>`);
  const g=$('.grid');
  items.forEach(it=>{const b=document.createElement('button');b.textContent=it.label;
    if(it.sub){const s=document.createElement('small');s.textContent=it.sub;b.append(s)}
    b.onclick=()=>{say(it.say||it.label);it.go()};g.append(b)});
  if(back)on('#back',back);
  on('#read',()=>say(title+'。'+items.map(i=>i.say||i.label).join('、')));
}
function home(){
  menu('なにを かきますか',[
    {label:'ひらがな',sub:'あいう',go:()=>rows('ひらがな',hira)},
    {label:'カタカナ',sub:'アイウ',go:()=>rows('カタカナ',kata)},
    {label:'すうじ',sub:'123',go:()=>practice(nums,home)},
    {label:'かんじ',sub:'山川花',say:'かんじ',go:kanjiMenu},
    {label:'ことば',sub:'ありがとう',go:()=>wordMenu()},
    {label:'せってい',sub:'ご家族用',go:settings}
  ],null,'home');
}
function rows(name,list){menu(name,list.map(r=>({label:r[0]+' ぎょう',sub:r,say:r[0]+'ぎょう',go:()=>practice(ch(r),()=>rows(name,list))})),home,'rows')}
function kanjiMenu(){menu('かんじ',Object.entries(kanji).map(([k,v])=>({label:k,sub:v.slice(0,3).map(x=>x.w).join(''),go:()=>practice(v,kanjiMenu)})),home,'home')}
function wordMenu(){
  const all=[...mine.slice(-5),...words].slice(0,10);
  menu('ことば',all.map(x=>({label:x.w,say:x.y,go:()=>practice([...x.w].map(c=>({w:c,y:c,word:x})),wordMenu,x)})),home,'rows');
}

/* 書く画面 */
let strokes=[],ctx,cv,size=0,penSeen=false,active=null;
function practice(list,back,word){
  let i=0;
  const show=()=>{
    const it=list[i];strokes=[];active=null;
    el(`<div class="top"><button id="back">← もどる</button><h1>${i+1} / ${list.length}</h1><button id="tr"></button></div>
    <div class="work"><div class="side"><div class="word" id="word"></div><div class="model" id="model"></div><div class="yomi" id="yomi"></div></div>
    <div class="stage"><div class="paper"><div id="trace"></div><canvas></canvas><div id="maru" hidden></div></div></div></div>
    <div class="bar"><button id="listen">🔊 きく</button><button id="clear">けす</button><button id="done" class="main">できた</button><button id="next">つぎへ →</button></div>`);
    $('#model').textContent=it.w;
    $('#yomi').textContent=word?word.y:(it.y!==it.w?it.y:'');
    if(word)[...word.w].forEach((c,n)=>{const s=document.createElement('span');s.textContent=c;if(n===i)s.className='now';$('#word').append(s)});
    const speak=()=>say(word?word.y+'。'+(/[ぁ-ゖ]/.test(it.w)?kana(it.w):it.w)
      :/^[ぁ-ゖ]$/.test(it.w)?kana(it.w):/[ァ-ヶ]/.test(it.w)?it.w:it.y);
    const label=()=>{$('#tr').textContent=cfg.trace?'なぞり：あり':'なぞり：なし';$('#trace').textContent=cfg.trace?it.w:''};
    label();
    on('#tr',()=>{cfg.trace=!cfg.trace;store.set('kk-cfg',cfg);label()});
    on('#back',back);
    on('#listen',speak);
    on('#clear',()=>{strokes=[];active=null;$('#maru').hidden=true;redraw()});
    on('#done',()=>{
      if(!strokes.length){say('しろい ところに かいてください');return}
      const m=$('#maru');m.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="5" opacity=".6"/></svg><div>よくできました</div>';m.hidden=false;say('よくできました');
    });
    $('#next').textContent=i===list.length-1?'おわり':'つぎへ →';
    on('#next',()=>{if(i<list.length-1){i++;show();speak2()}else{say('おつかれさまでした');finish(back)}});
    cv=$('canvas');ctx=cv.getContext('2d');fit();bind();
    speak2=speak;
  };
  let speak2=()=>{};
  show();
  /* 最初の1文字も読む(ボタンを押した直後なのでiPadでも音が出る) */
  speak2();
}
function finish(back){
  el(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px"><h1 style="flex:0">おつかれさまでした</h1><button id="again" class="main">もういちど えらぶ</button><button id="top">さいしょに もどる</button></div>`);
  on('#again',back);on('#top',home);
}
function fit(){
  const st=$('.stage');if(!st)return;
  const p=$('.paper');p.style.width=p.style.height='0px';
  size=Math.floor(Math.min(st.clientWidth,st.clientHeight));
  p.style.width=p.style.height=size+'px';
  $('#trace').style.fontSize=size*0.78+'px';
  const d=window.devicePixelRatio||1,w=cv.clientWidth;
  cv.width=cv.height=Math.round(w*d);ctx.setTransform(d,0,0,d,0,0);redraw();
}
/* 線は0〜1の割合で保存し、iPadの向きを変えても残す */
function redraw(){
  const w=cv.clientWidth;ctx.clearRect(0,0,w,w);
  ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=w*0.028;ctx.strokeStyle=ctx.fillStyle='#111';
  for(const s of strokes){
    ctx.beginPath();
    if(s.length===1){ctx.arc(s[0][0]*w,s[0][1]*w,ctx.lineWidth/2,0,7);ctx.fill();continue}
    s.forEach(([x,y],n)=>n?ctx.lineTo(x*w,y*w):ctx.moveTo(x*w,y*w));ctx.stroke();
  }
}
function bind(){
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left-cv.clientLeft)/r.width,(e.clientY-r.top-cv.clientTop)/r.height]};
  cv.onpointerdown=e=>{
    if(e.pointerType==='pen')penSeen=true;
    else if(penSeen&&e.pointerType==='touch')return;   /* ペン使用中は手のひらを無視 */
    if(active!==null&&e.pointerType!=='pen')return;
    e.preventDefault();active=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}
    $('#maru').hidden=true;strokes.push([pt(e)]);redraw();
  };
  cv.onpointermove=e=>{if(e.pointerId!==active)return;strokes[strokes.length-1].push(pt(e));redraw()};
  cv.onpointerup=cv.onpointercancel=e=>{if(e.pointerId===active)active=null};
}

/* ご家族用 */
function settings(){
  el(`<div class="top"><button id="back">← もどる</button><h1>せってい（ご家族用）</h1></div>
  <div class="opts"><button id="slow"></button><button id="finger"></button></div>
  <div class="family"><b>ことばを追加（お名前・住所など。新しい5件が「ことば」に出ます）</b>
  <input id="w" maxlength="12" placeholder="書くことば（例：花子）" aria-label="書くことば">
  <input id="y" maxlength="30" placeholder="読み（例：はなこ）" aria-label="読み">
  <button id="add" class="main">追加する</button><div id="msg" role="status"></div><div id="list"></div></div>`);
  const labels=()=>{$('#slow').textContent=cfg.slow?'読み上げ：ゆっくり':'読み上げ：ふつう';$('#finger').textContent='指でも書けるように戻す';$('#finger').hidden=!penSeen};
  labels();
  on('#back',home);
  on('#slow',()=>{cfg.slow=!cfg.slow;store.set('kk-cfg',cfg);labels();say('このはやさで よみます')});
  on('#finger',()=>{penSeen=false;labels()});
  const list=()=>{$('#list').innerHTML='';mine.forEach((x,n)=>{const d=document.createElement('div');d.className='item';const s=document.createElement('span');s.textContent=`${x.w}（${x.y}）`;const b=document.createElement('button');b.textContent='削除';b.onclick=()=>{mine.splice(n,1);store.set('kk-words',mine);list()};d.append(s,b);$('#list').append(d)})};
  list();
  on('#add',()=>{
    const w=$('#w').value.replace(/\s/g,''),y=$('#y').value.trim();
    if(!w){$('#msg').textContent='書くことばを入れてください';return}
    mine.push({w,y:y||w});const ok=store.set('kk-words',mine);
    $('#msg').textContent=ok?'追加しました':'このブラウザでは保存できないため、閉じると消えます';
    $('#w').value=$('#y').value='';list();
  });
}
addEventListener('resize',()=>{if($('canvas'))fit()});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.fonts&&document.fonts.ready.then(()=>{if($('canvas'))fit()});
home();
</script>

</body></html>
