<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>かきとり練習</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
/* 1画面1つのこと。大きな文字、大きなボタン、スクロールなし(横向きでも)。高コントラストのため配色は固定 */
:root{--bg:#fbfaf5;--ink:#111;--line:#333;--blue:#0b4f9c;--soft:#e6eef8;--guide:#c9c9c9;--red:#c62828;
--kyo:"Klee One","Klee","Hiragino Maru Gothic ProN",sans-serif;--ui:"Hiragino Sans","Noto Sans JP",sans-serif;color-scheme:light}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{height:100%;display:flex;flex-direction:column;padding:12px 16px;gap:12px}
button{font:700 clamp(20px,3.6vmin,34px)/1.25 var(--ui);border:3px solid var(--blue);background:#fff;color:var(--blue);border-radius:18px;min-height:64px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active{background:var(--soft)}
button:focus-visible{outline:5px solid #f2a900}
button.main{background:var(--blue);color:#fff}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:clamp(24px,4.6vmin,44px);text-align:center;flex:1}
.grid{flex:1;min-height:0;display:grid;gap:14px;grid-auto-rows:1fr}
.grid button{font-family:var(--kyo);font-size:clamp(26px,6vmin,60px);color:var(--ink);padding:4px}
.grid button small{display:block;font:700 .45em var(--ui);color:var(--blue)}
.home{grid-template-columns:1fr 1fr}
.rows{grid-template-columns:1fr 1fr}
@media (orientation:landscape){.home{grid-template-columns:repeat(3,1fr)}.rows{grid-template-columns:repeat(4,1fr)}}
.work{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.sheet{position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 40px/1.3 var(--kyo);white-space:nowrap;overflow:hidden}
#model{flex:2}
.paper{flex:3;background:#fff;border:4px solid var(--line);border-radius:8px}
#trace{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#d4d4d4;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.list button{flex:1;min-height:0;text-align:left;font:600 min(8.4vw,6.2vh)/1.1 var(--kyo);color:var(--ink);padding:0 12px;white-space:nowrap;overflow:hidden}
.list button::before{content:"●";color:var(--blue);font-size:.45em;vertical-align:middle;margin-right:.7em}
.pager{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;font-size:28px;font-weight:700}
.pager button{min-height:80px}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bar button{min-height:clamp(72px,11vmin,110px)}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.family{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;flex:1;font-size:22px}
.family input{font-size:24px;padding:12px;border:2px solid var(--line);border-radius:10px;width:100%;-webkit-user-select:text;user-select:text;background:#fff;color:var(--ink)}
.family .item{display:flex;justify-content:space-between;align-items:center;gap:12px}
</style>
<div id="app" lang="ja"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const cfg=Object.assign({trace:true,slow:true},store.get('kk-cfg',{}));
let mine=store.get('kk-words',[]);

/* 読み上げ */
function say(t){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=cfg.slow?0.7:0.95;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-')==='ja-JP');if(v)u.voice=v;
  speechSynthesis.speak(u);
}
/* 「は」「へ」を助詞の読み(わ・え)にしないため、カタカナで読ませる */
const kana=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));

/* 教材: 各項目は {w:書く文字, y:読み} */
const ch=s=>[...s].map(c=>({w:c,y:c}));
const pairs=s=>s.split(' ').map(p=>{const[w,y]=p.split(':');return{w,y}});
const hira=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','やゆよ','らりるれろ','わをん'];
const kata=hira.map(kana);
const kanji={
 'かず':{lines:['一二三四五','六七八九十'],y:'いち、に、さん、よん、ご、ろく、なな、はち、きゅう、じゅう'},
 'しぜん':{lines:['日月火水','木土山川','空雨花'],y:'ひ、つき、ひ、みず、き、つち、やま、かわ、そら、あめ、はな'},
 'ひと・からだ':{lines:['人子女男','目耳口手足'],y:'ひと、こ、おんな、おとこ、め、みみ、くち、て、あし'},
 'ようす':{lines:['大中小上下','左右白赤青'],y:'おおきい、なか、ちいさい、うえ、した、ひだり、みぎ、しろ、あか、あお'}
};
const nums={lines:['01234','56789'],y:'ぜろ、いち、に、さん、よん、ご、ろく、なな、はち、きゅう'};
/* / は改行の位置 */
const sentences=`無理せず/いこうね
体を大切に/してね
心から/ありがとう
少し休んで/ください
今日も/笑顔でね
元気で/いてください
会えて/うれしかった
何かあれば/言ってね
ゆっくり/休んで
また会えると/いいね
また/あしたね
また/会いましょう
にこにこ/してね
大好きだよ
大丈夫だよ
すてきな/日だね
元気で/いてね
気を付けて
いつも感謝/しています
いつも/ありがとう
会いに/来ました`.split('\n').map(t=>({lines:t.split('/'),y:t.replace('/','')}));
const autoLines=w=>{const c=[...w],n=Math.ceil(c.length/6),k=Math.ceil(c.length/n),r=[];for(let i=0;i<c.length;i+=k)r.push(c.slice(i,i+k).join(''));return r};
const label=x=>x.lines.join('');

const el=(h)=>{app.innerHTML=h};
const on=(s,f)=>{$(s).onclick=f};
function menu(title,items,back,cls){
  el(`<div class="top">${back?'<button id="back">← もどる</button>':''}<h1>${title}</h1><button id="read">🔊 きく</button></div><div class="grid ${cls}"></div>`);
  const g=$('.grid');
  items.forEach(it=>{const b=document.createElement('button');b.textContent=it.label;
    if(it.sub){const s=document.createElement('small');s.textContent=it.sub;b.append(s)}
    b.onclick=()=>{say(it.say||it.label);it.go()};g.append(b)});
  if(back)on('#back',back);
  on('#read',()=>say(title+'。'+items.map(i=>i.say||i.label).join('、')));
}
function home(){
  menu('なにを かきますか',[
    {label:'ぶんしょう',sub:'ありがとう',go:()=>sentenceMenu(0)},
    {label:'ひらがな',sub:'あいう',go:()=>rows('ひらがな',hira)},
    {label:'カタカナ',sub:'アイウ',go:()=>rows('カタカナ',kata)},
    {label:'すうじ',sub:'123',go:()=>practice([nums],0,home)},
    {label:'かんじ',sub:'山川花',say:'かんじ',go:kanjiMenu},
    {label:'せってい',sub:'ご家族用',go:settings}
  ],null,'home');
}
function rows(name,list){menu(name,list.map((r,n)=>({label:r[0]+' ぎょう',sub:r,say:r[0]+'ぎょう',go:()=>practice(list.map(t=>({lines:[t],y:[...kana(t)].join('、')})),n,()=>rows(name,list))})),home,'rows')}
function kanjiMenu(){menu('かんじ',Object.entries(kanji).map(([k,v])=>({label:k,sub:v.lines[0].slice(0,3),go:()=>practice([v],0,kanjiMenu)})),home,'home')}
const PER=7;
function sentenceMenu(page){
  const all=[...sentences,...mine.map(m=>({lines:autoLines(m.w),y:m.y}))],pages=Math.ceil(all.length/PER);
  el(`<div class="top"><button id="back">← もどる</button><h1>ぶんしょう</h1><button id="read">🔊 きく</button></div><div class="list"></div>
  <div class="pager"><button id="prev">← まえ</button><span>${page+1} / ${pages}</span><button id="more">つぎ →</button></div>`);
  const here=all.slice(page*PER,(page+1)*PER);
  here.forEach((x,n)=>{const b=document.createElement('button');b.textContent=label(x);b.onclick=()=>practice(all,page*PER+n,i=>sentenceMenu(Math.floor(i/PER)));$('.list').append(b)});
  for(let n=here.length;n<PER;n++){const d=document.createElement('div');d.style.flex=1;$('.list').append(d)}
  $('#prev').style.visibility=page?'visible':'hidden';$('#more').style.visibility=page<pages-1?'visible':'hidden';
  on('#back',home);on('#read',()=>say(here.map(x=>x.y).join('。')));
  on('#prev',()=>sentenceMenu(page-1));on('#more',()=>sentenceMenu(page+1));
}

/* 書く画面 */
let strokes=[],ctx,cv,fs=40,current=null,penSeen=false,active=null;
function practice(list,start,back){
  let i=start;
  const show=()=>{
    current=list[i];strokes=[];active=null;
    el(`<div class="top"><button id="back">← もどる</button><h1>${list.length>1?`${i+1} / ${list.length}`:''}</h1><button id="tr"></button></div>
    <div class="work"><div class="sheet" id="model"></div><div class="sheet paper"><div id="trace"></div><canvas aria-label="書くところ"></canvas></div></div>
    <div class="bar"><button id="listen">🔊 きく</button><button id="clear">けす</button><button id="next"></button></div>`);
    for(const box of ['#model','#trace'])current.lines.forEach(t=>{const d=document.createElement('div');d.textContent=t;$(box).append(d)});
    const mode=()=>{$('#tr').textContent=cfg.trace?'なぞり：あり':'なぞり：なし';$('#trace').hidden=!cfg.trace};
    mode();
    on('#tr',()=>{cfg.trace=!cfg.trace;store.set('kk-cfg',cfg);mode()});
    on('#back',()=>back(i));
    on('#listen',speak);
    on('#clear',()=>{strokes=[];active=null;redraw()});
    $('#next').textContent=i===list.length-1?'おわり':'つぎへ →';
    on('#next',()=>{if(i<list.length-1){i++;show();speak()}else{say('おつかれさまでした');finish(()=>back(i))}});
    cv=$('canvas');ctx=cv.getContext('2d');fit();bind();
  };
  const speak=()=>say(list[i].y);
  show();speak();
}
function finish(back){
  el(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px"><h1 style="flex:0">おつかれさまでした</h1><button id="again" class="main">もういちど えらぶ</button><button id="top">さいしょに もどる</button></div>`);
  on('#again',back);on('#top',home);
}
/* お手本と書く場所(なぞり)は同じ文字サイズにそろえる */
function fit(){
  if(!$('.paper')||!current)return;
  const m=$('#model'),p=$('.paper'),n=current.lines.length,len=Math.max(...current.lines.map(t=>[...t].length));
  fs=Math.floor(Math.min(p.clientWidth*0.94/Math.max(len,4),m.clientHeight/(n*1.3),p.clientHeight*0.94/(n*1.3)));
  m.style.fontSize=p.style.fontSize=fs+'px';
  const d=window.devicePixelRatio||1;
  cv.width=Math.round(cv.clientWidth*d);cv.height=Math.round(cv.clientHeight*d);ctx.setTransform(d,0,0,d,0,0);redraw();
}
/* 線は中央からの距離を文字サイズ単位で保存し、向きを変えてもなぞりとずれないようにする */
function redraw(){
  const cx=cv.clientWidth/2,cy=cv.clientHeight/2;ctx.clearRect(0,0,cx*2,cy*2);
  ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=Math.max(5,fs*0.06);ctx.strokeStyle=ctx.fillStyle='#111';
  for(const s of strokes){
    ctx.beginPath();
    if(s.length===1){ctx.arc(cx+s[0][0]*fs,cy+s[0][1]*fs,ctx.lineWidth/2,0,7);ctx.fill();continue}
    s.forEach(([x,y],n)=>n?ctx.lineTo(cx+x*fs,cy+y*fs):ctx.moveTo(cx+x*fs,cy+y*fs));ctx.stroke();
  }
}
function bind(){
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left-r.width/2)/fs,(e.clientY-r.top-r.height/2)/fs]};
  cv.onpointerdown=e=>{
    if(e.pointerType==='pen')penSeen=true;
    else if(penSeen&&e.pointerType==='touch')return;   /* ペン使用中は手のひらを無視 */
    if(active!==null&&e.pointerType!=='pen')return;
    e.preventDefault();active=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}
    strokes.push([pt(e)]);redraw();
  };
  cv.onpointermove=e=>{if(e.pointerId!==active)return;strokes[strokes.length-1].push(pt(e));redraw()};
  cv.onpointerup=cv.onpointercancel=e=>{if(e.pointerId===active)active=null};
}

/* ご家族用 */
function settings(){
  el(`<div class="top"><button id="back">← もどる</button><h1>せってい（ご家族用）</h1></div>
  <div class="opts"><button id="slow"></button><button id="finger"></button></div>
  <div class="family"><b>文章を追加（お名前など。「ぶんしょう」の最後に出ます）</b>
  <input id="w" maxlength="18" placeholder="書く文章（例：花子）" aria-label="書く文章">
  <input id="y" maxlength="30" placeholder="読み（例：はなこ）" aria-label="読み">
  <button id="add" class="main">追加する</button><div id="msg" role="status"></div><div id="list"></div></div>`);
  const labels=()=>{$('#slow').textContent=cfg.slow?'読み上げ：ゆっくり':'読み上げ：ふつう';$('#finger').textContent='指でも書けるように戻す';$('#finger').hidden=!penSeen};
  labels();
  on('#back',home);
  on('#slow',()=>{cfg.slow=!cfg.slow;store.set('kk-cfg',cfg);labels();say('このはやさで よみます')});
  on('#finger',()=>{penSeen=false;labels()});
  const list=()=>{$('#list').innerHTML='';mine.forEach((x,n)=>{const d=document.createElement('div');d.className='item';const s=document.createElement('span');s.textContent=`${x.w}（${x.y}）`;const b=document.createElement('button');b.textContent='削除';b.onclick=()=>{mine.splice(n,1);store.set('kk-words',mine);list()};d.append(s,b);$('#list').append(d)})};
  list();
  on('#add',()=>{
    const w=$('#w').value.replace(/\s/g,''),y=$('#y').value.trim();
    if(!w){$('#msg').textContent='書く文章を入れてください';return}
    mine.push({w,y:y||w});const ok=store.set('kk-words',mine);
    $('#msg').textContent=ok?'追加しました':'このブラウザでは保存できないため、閉じると消えます';
    $('#w').value=$('#y').value='';list();
  });
}
addEventListener('resize',()=>{fit()});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.fonts&&document.fonts.ready.then(()=>{fit()});
home();
</script>

</body></html>
