<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<title>算数の練習</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
:root{
  --ink:#1f2d3d; --panel:#fffdf3; --line:#2f6f8f; --orange:#f08a24;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
body{
  background:
    radial-gradient(ellipse 70% 30% at 8% 66%,#f6d58f 0 98%,transparent 100%),
    radial-gradient(ellipse 60% 26% at 92% 62%,#f2c777 0 98%,transparent 100%),
    linear-gradient(180deg,#bfe5f6 0%,#dff1e6 40%,#f6efc4 62%,#a5d66f 82%,#8ccb5e 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--ui);font-weight:700;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow-x:hidden}
.screen{display:none;min-height:100%;padding:28px 24px;flex-direction:column;align-items:center;justify-content:center;gap:26px;max-width:960px;margin:0 auto}
.screen.on{display:flex}
h1{font-family:var(--ui);font-weight:900;font-size:clamp(60px,12vw,112px);margin:0;letter-spacing:.06em;line-height:1.1;color:#2b4a6b}
h1 span{color:#e8742a}
.sub{font-size:clamp(24px,3.4vw,32px);margin:0}
.group{width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
button{font-family:var(--ui);font-weight:900;cursor:pointer;border:0;color:inherit}
.opt,.quit{background:var(--panel);border:3px solid var(--line);color:#1d3a4a;border-radius:18px}
.opt{font-size:clamp(22px,3.4vw,32px);padding:16px 30px;min-width:130px;min-height:68px}
.opt[aria-pressed="true"]{background:var(--line);color:#fff}
.go{background:#ffb43c;color:#3b1d00;font-size:clamp(30px,5vw,44px);padding:22px 64px;border-radius:999px;min-height:84px;margin-top:6px;box-shadow:0 6px 0 #c77a12}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #c77a12}
button:focus-visible{outline:4px solid var(--line);outline-offset:3px}
.best{font-size:26px;margin:0;min-height:1.4em}

#game{justify-content:flex-start;gap:10px;padding-top:12px;padding-bottom:12px}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:clamp(20px,3vw,26px)}
.bar{flex:1;height:14px;margin:0 20px;background:rgba(31,45,61,.18);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--orange);transition:width .4s}
.quit{font-size:20px;padding:8px 18px;border-radius:12px;min-height:48px}
.problem{font-weight:900;font-size:clamp(64px,13vw,140px);line-height:1.15;margin:6px 0 0;text-align:center;letter-spacing:.06em;background:var(--panel);color:#1a1a1a;border:6px solid #5cc4c0;outline:5px solid #b27a43;border-radius:14px;padding:6px 28px;max-width:100%}
.msg{min-height:1.6em;font-size:clamp(26px,4vw,38px);margin:0;text-align:center}
.field{width:100%;display:grid;grid-template-columns:1fr 1fr;justify-items:center;gap:clamp(16px,3vw,32px);margin-top:4px}
.card{--d:clamp(150px,min(24vh,40vw),270px);position:relative;width:var(--d);height:var(--d);padding:0;border-radius:50%;overflow:hidden;color:#1a1a1a;font-size:calc(var(--d)*.5);line-height:1;
  background:radial-gradient(circle closest-side,#fff9fd 0 68%,#ffd0ea 68% 74%,#fff 74% 79%,#f08cc8 79% 100%);
  box-shadow:0 7px 0 rgba(140,60,110,.28)}
.card:active{filter:brightness(.95)}
.card.hit{box-shadow:0 0 0 10px #ffe27a,0 7px 0 rgba(140,60,110,.28)}
.card.miss{animation:shake .4s;opacity:.75;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.mark{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:900;line-height:1;pointer-events:none;text-shadow:0 0 8px #fff;animation:pop .3s ease-out forwards}
.mark.o{color:#d6281c}.mark.x{color:#2a4f9e}
@keyframes pop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:.9}}
@media (min-aspect-ratio:5/4){
  .screen{max-width:1100px}
  .field{grid-template-columns:repeat(4,1fr)}
  .card{--d:clamp(150px,min(34vh,20vw),250px)}
}

.stars{font-size:clamp(56px,11vw,110px);letter-spacing:.1em;color:#f0a020;text-shadow:0 3px 0 #b8760b;margin:0}
.stars .off{opacity:.3}
.big{font-size:clamp(28px,5vw,44px);margin:0;text-align:center}
.res-note{font-size:clamp(26px,3.8vw,34px);margin:0;text-align:center}
.snd{min-width:170px}
#result{justify-content:flex-start;padding-top:36px}
.hintbox{white-space:nowrap;overflow:hidden;font-size:clamp(34px,5.4vw,50px);line-height:1.3;text-align:center;color:#1a1a1a;min-height:1.3em;width:100%;background:var(--panel);border-radius:14px;padding:6px 14px}
.hintbox:empty{background:transparent}
.probwrap{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:stretch;gap:6px;cursor:pointer}
.probwrap .problem{margin:0}
.probwrap{--f2:clamp(56px,12vw,104px)}
.problem .pt{display:inline-block}
.problem .sqm{display:inline-block;box-sizing:border-box;width:.6em;height:.7em;border:.1em solid currentColor;border-radius:.16em;vertical-align:baseline}
.probwrap.two .problem{display:flex;align-items:center;justify-content:center;font-size:var(--f2);height:calc(var(--f2)*.8 + 22px);padding:0 16px;border-width:4px;outline-width:3px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.probwrap.two .pt{transform:scaleY(.8)}
.probwrap.two + .msg{display:none}
#hintbtn{font-size:clamp(26px,3.6vw,34px);min-height:68px;padding:10px 26px;min-width:0;margin-right:12px}
.misslist{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px}
.misslist h2{margin:0 0 4px;font-size:clamp(22px,3.4vw,30px);text-align:center}
.misslist p{margin:0;text-align:center;font-size:clamp(20px,3vw,26px)}
.mrow{background:var(--panel);color:#1a1a1a;border:3px solid #cfe3ec;border-radius:14px;padding:14px 20px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
.mq{font-size:clamp(30px,5vw,44px);font-weight:900}
.mp{font-size:clamp(22px,3vw,28px)}
.md{font-size:22px;opacity:.85}
@media (prefers-reduced-motion:reduce){.mark,.card.miss{animation-duration:.01s}}
</style>
</head>
<body>

<section id="menu" class="screen on">
  <h1>算数の<span>練習</span></h1>
  <p class="sub">足し算・引き算で、あたまをきたえよう</p>
  <button class="go" id="start">はじめる</button>
  <button class="opt" id="trainbtn" type="button">わり算の特訓</button>
  <button class="opt" id="multbtn" type="button">かけ算の特訓</button>
  <p class="best" id="best"></p>
  <button class="opt" id="showlog" type="button">きろくをみる</button>
  <div class="row"><button class="quit snd" type="button" aria-pressed="true">♪ 音楽 ON</button><button class="quit mk" type="button" aria-label="答えの表示をきりかえ">？⇔□</button></div>
</section>

<section id="game" class="screen">
  <div class="top"><span id="count">1 / 10</span><div class="bar"><i id="prog"></i></div><button class="opt" id="hintbtn" type="button" style="display:none">ヒント</button><button class="quit" id="quit">やめる</button></div>
  <div class="hintbox" id="hintbox" style="display:none"></div>
  <div class="probwrap" id="probwrap"><p class="problem" id="problem"></p><p class="problem" id="problem2" style="display:none"></p></div>
  <p class="msg" id="msg"></p>
  <div class="field" id="field"></div>
  <div class="row"><button class="quit snd" type="button" aria-pressed="true">♪ 音楽 ON</button><button class="quit mk" type="button" aria-label="答えの表示をきりかえ">？⇔□</button></div>
</section>

<section id="log" class="screen">
  <p class="big">これまでの記録</p>
  <p class="big" id="logsum"></p>
  <p class="res-note" id="loglevel"></p>
  <div class="misslist" id="logmiss"></div>
  <div class="row" id="resetrow"><button class="opt" id="resetbtn" type="button">きろくをリセット</button></div>
  <div class="group" id="resetask" style="display:none"><p class="res-note">きろくとレベルが、さいしょに戻ります。よろしいですか？</p><div class="row"><button class="opt" id="resetyes" type="button">消す</button><button class="opt" id="resetno" type="button">やめる</button></div></div>
  <button class="opt" id="logback" type="button">メニューへ</button>
</section>

<section id="result" class="screen">
  <p class="stars" id="stars"></p>
  <div class="row">
    <button class="go" id="again">次へ</button>
    <button class="opt" id="home" style="align-self:center">メニュー</button>
  </div>
  <p class="big" id="score"></p>
  <p class="res-note" id="note"></p>
  <p class="res-note" id="stagenote"></p>
  <div class="misslist" id="miss"></div>
</section>

  function next(){
    if (q >= TOTAL){ finish(); return; }
    q++; missed = false; locked = false; picks = [];
    cur = mode2 === "train" ? trainQ() : makeQuestion(); hintLv = 0; hintLines = []; hintUsed = false;
    $("count").textContent = q + " / " + TOTAL;
    $("prog").style.width = ((q-1)/TOTAL*100) + "%";
    setProb($("problem"), cur.txt || (cur.a + " " + cur.op + " " + cur.b + " = ?"));
    collapseProblem();
    $("msg").textContent = ""; $("hintbtn").style.display = mode2 === "train" ? "" : "none"; showHints();
    var f = $("field"); f.innerHTML = "";
    makeChoices(cur.ans).forEach(function(v){
      var c = document.createElement("button");
      c.className = "card"; c.type = "button";
      var s = document.createElement("span"); s.className = "v"; s.textContent = v;
      c.appendChild(s);
      c.addEventListener("click", function(){ answer(c, v); });
      f.appendChild(c);
    });
  }

  function addMark(card, kind){
    var m = document.createElement("span"); m.className = "mark " + kind;
    m.textContent = kind === "o" ? "○" : "×"; card.appendChild(m);
  }
  function answer(card, v){
    if (locked) return;
    collapseProblem();
    if (v === cur.ans){
      locked = true;
      if (mode2 === "train") trainDone(); else { recordProgress(); if (!missed) firstTry++; else wrongList.push({ q: cur.a + " " + cur.op + " " + cur.b, ans: cur.ans, picked: picks.slice(), t: cur.txt });
      logQuestion(missed ? wrongList[wrongList.length - 1] : null); }
      addMark(card, "o");
      card.classList.add("hit");
      sfxOk();
      $("msg").textContent = missed ? "正解です！" : "ピンポン！一発で正解！";
      setTimeout(next, 1000);
    } else {
      missed = true;
      card.classList.add("miss"); addMark(card, "x"); picks.push(v);
      sfxNg();
      $("msg").textContent = "おしい！もう一度ためそう";
    }
  }

  function finish(){
    if (mode2 === "train"){ finishTrain(); return; }
    $("prog").style.width = "100%";
    var n = firstTry >= 10 ? 3 : firstTry >= 7 ? 2 : firstTry >= 4 ? 1 : 0;
    var s = "";
    for (var i=0;i<3;i++) s += i < n ? "★" : '<span class="off">★</span>';
    $("stars").innerHTML = s;
    $("score").textContent = "正解 " + firstTry + "問　不正解 " + (TOTAL - firstTry) + "問";
    var notes = ["ゆっくり、もう一度いってみよう", "いい調子です", "とても良い修行でした", "満点！お見事です"];
    $("note").textContent = notes[n];
    if (firstTry > loadBest()){ saveBest(firstTry); }
    saveLog(function(L){ L.plays++; }); renderMiss($("miss"), wrongList, true);
    $("stagenote").textContent = (rollMsg ? "「" + rollMsg + "」はいったんおやすみして、前の問題に戻ります。" : "") + (stageUp ? "つぎから「" + GN[stageUp] + "」がまざります" : "");
    sfxFinish(n);
    show("result");
  }

  function start(){ mode2 = "normal"; ensureMusic(); if (!PROG) PROG = loadProg(); stageUp = 0; rollMsg = ""; q = 0; firstTry = 0; wrongList = []; show("game"); next(); }

  $("showlog").addEventListener("click", function(){
    var L = loadLog();
    $("logsum").textContent = (L.ok + L.ng) ? (L.ok + L.ng) + "問あそんで　正解 " + L.ok + "問・不正解 " + L.ng + "問" : "まだ記録がありません";
    renderMiss($("logmiss"), L.mistakes, false);
    $("loglevel").textContent = levelText();
    show("log");
  });
  $("logback").addEventListener("click", function(){ drawBest(); show("menu"); });
  function resetUi(ask){ $("resetask").style.display = ask ? "" : "none"; $("resetrow").style.display = ask ? "none" : ""; }
  $("showlog").addEventListener("click", function(){ resetUi(false); });
  $("resetbtn").addEventListener("click", function(){ resetUi(true); });
  $("resetno").addEventListener("click", function(){ resetUi(false); });
  $("resetyes").addEventListener("click", function(){
    PROG = null; MEMLOG = null; TR = null; MR = null;
    try { localStorage.removeItem(TKEY); localStorage.removeItem(MKEY2); } catch(e){}
    try { localStorage.removeItem(LOGKEY); localStorage.removeItem(PKEY); localStorage.removeItem("sansu-ninja-best"); } catch(e){}
    resetUi(false);
    $("logsum").textContent = "まだ記録がありません";
    $("loglevel").textContent = levelText();
    renderMiss($("logmiss"), [], false);
    drawBest();
  });
  $("start").addEventListener("click", start);
  $("again").addEventListener("click", function(){ if (mode2 === "train") startTrain(MUL); else start(); });
  $("trainbtn").addEventListener("click", function(){ startTrain(false); });
  $("multbtn").addEventListener("click", function(){ startTrain(true); });
  $("home").addEventListener("click", function(){ drawBest(); show("menu"); });
  $("quit").addEventListener("click", function(){ drawBest(); show("menu"); });
  drawBest();
})();
</script>
</body>
</html>
