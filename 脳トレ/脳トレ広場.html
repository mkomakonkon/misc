<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<title>脳トレ広場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
:root{--ink:#17202a;--panel:#ffffff;--pri:#14607a;--acc:#f08a24;--ok:#2e7d32;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{font-size:21px}
html.fs0{font-size:18px}
html.fs2{font-size:27px}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,#d7eefa 0%,#fdf6df 55%,#e6f2c8 100%);background-attachment:fixed;
  color:var(--ink);font-family:var(--ui);font-weight:700;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow-x:hidden;overscroll-behavior:none}
button{font-family:var(--ui);font-weight:900;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
.screen{display:none;min-height:100dvh;padding:1rem 1rem 1.5rem;max-width:1000px;margin:0 auto;flex-direction:column;align-items:center;gap:1rem}
.screen.on{display:flex}
h1{font-size:3rem;margin:.4rem 0 0;color:#23506b;letter-spacing:.05em;text-align:center}
h1 span{color:#e8742a}
.sub{font-size:1.3rem;margin:0;text-align:center}
.btn{background:var(--panel);border:4px solid var(--pri);border-radius:1.2rem;font-size:1.3rem;padding:.6rem 1.4rem;min-height:3.6rem}
.btn:active{filter:brightness(.93)}
.go{background:#ffb43c;border-color:#c77a12;box-shadow:0 .3rem 0 #c77a12;font-size:1.7rem;padding:1rem 2rem;border-radius:2rem;width:100%;max-width:720px;line-height:1.3}
.go small{display:block;font-size:1.05rem;font-weight:700;margin-top:.2rem}
.go:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 #c77a12}
.row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.ggrid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.gbtn{background:var(--panel);border:4px solid var(--pri);border-radius:1.3rem;padding:.8rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;min-height:9rem}
.gbtn .gi{font-size:2.8rem;line-height:1}
.gbtn .gn{font-size:1.35rem}
.gbtn .gd{font-size:1rem;font-weight:700}
.gbtn .gl{font-size:1rem;color:var(--pri)}
.gbtn:active{filter:brightness(.93)}
/* play */
.hud{width:100%;display:flex;align-items:center;gap:.8rem}
.hud .count{font-size:1.4rem;white-space:nowrap;min-width:4.5rem}
.bar{flex:1;height:1rem;background:rgba(23,32,42,.15);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.hud .btn{min-height:3rem;font-size:1.1rem;padding:.3rem 1rem}
#title{font-size:1.5rem;margin:0}
#msg{min-height:2.6rem;font-size:1.5rem;text-align:center;margin:0;line-height:1.35}
#stage{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
.cgrid{display:grid;gap:12px;justify-content:center}
.tb{background:#fff;border:4px solid var(--pri);border-radius:50%;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
.tb.done{background:#c8e6c9;border-color:var(--ok);color:#1b5e20}
.tb.hint{animation:pulse .6s 3;border-color:var(--acc);background:#fff1d6}
@keyframes pulse{50%{transform:scale(1.15)}}
.card{background:#1f7a8c;border:4px solid #0f4c5c;border-radius:1rem;padding:0;line-height:1;display:flex;align-items:center;justify-content:center;color:#fff}
.card.up{background:#fff;border-color:var(--pri);color:var(--ink)}
.card.matched{background:#c8e6c9;border-color:var(--ok);color:var(--ink)}
.ob{background:#fff;border:4px solid #8aa4b3;border-radius:1rem;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
.ob.miss,.cat.miss,.opt.miss{opacity:.3;pointer-events:none}
.pad{border:6px solid rgba(0,0,0,.25);border-radius:1.4rem;opacity:.7;transition:opacity .1s,transform .1s}
.pad.lit{opacity:1;transform:scale(1.07);border-color:#fff;box-shadow:0 0 0 8px #ffe27a}
.item{background:#fff;border:4px solid #8aa4b3;border-radius:1.5rem;padding:.8rem 2.5rem;text-align:center}
.item .e{font-size:6.5rem;line-height:1.1}
.item .w{font-size:2.2rem}
.cats{display:grid;gap:.8rem;width:100%;max-width:720px}
.cat{border:4px solid #3b4a55;border-radius:1.2rem;font-size:1.9rem;padding:1rem;min-height:5rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;width:100%;max-width:720px}
.opt{background:#fff;border:4px solid var(--pri);border-radius:1.2rem;font-size:2rem;padding:1rem .4rem;min-height:5.2rem}
.opt .sw{display:inline-block;width:1.4rem;height:1.4rem;border-radius:50%;margin-right:.5rem;vertical-align:-.15rem;border:2px solid #000}
.clock{width:min(78vw,52dvh,400px);height:auto}
.panel{background:#263238;border-radius:1.5rem;padding:.6rem 2.5rem;min-width:min(90vw,520px);text-align:center;display:flex;align-items:center;justify-content:center;min-height:9rem}
.panel .word{font-size:5.5rem;line-height:1.2;font-weight:900}
.panel .blk{width:9rem;height:6rem;border-radius:1rem}
.cue{font-size:1.9rem;padding:.3rem 1.2rem;border-radius:1rem;background:#fff;border:4px solid var(--ink)}
.cue.c{background:#ffe0b2;border-color:#e65100}
.cue.r{background:#bbdefb;border-color:#0d47a1}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#flash{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:min(60vmin,420px);color:#d6281c;pointer-events:none;text-shadow:0 0 12px #fff;z-index:9}
#flash.on{display:flex;animation:fl .8s ease-out forwards}
@keyframes fl{0%{transform:scale(1.4);opacity:0}25%{opacity:.9}100%{transform:scale(1);opacity:0}}
/* result / rest */
.stars{font-size:5rem;color:#f0a020;text-shadow:0 .2rem 0 #b8760b;margin:0;letter-spacing:.1em}
.stars .off{opacity:.25}
.big{font-size:1.7rem;margin:0;text-align:center;line-height:1.5}
.mid{font-size:1.4rem;margin:0;text-align:center;line-height:1.5}
/* log */
.lcard{width:100%;background:#fff;border:4px solid #8aa4b3;border-radius:1.2rem;padding:.8rem 1.2rem}
.lh{font-size:1.2rem;color:var(--pri)}
.lt{font-size:1.7rem;line-height:1.5}
.mrow{font-size:.85rem;line-height:1.5;padding:.35rem 0;border-top:1px solid #cfd8dc}
.mrow b{color:var(--pri)}
.drow{display:flex;align-items:center;gap:.8rem;font-size:1.5rem;margin:.3rem 0}
.drow .dd{min-width:7.5rem}
.drow .db{height:1.4rem;background:var(--acc);border-radius:99px;min-width:.4rem}
.drow .dm{white-space:nowrap}
.grow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;justify-content:space-between;padding:.6rem 0;border-top:2px solid #cfd8dc}
.grow:first-child{border-top:0}
.grow .gt{font-size:1.5rem;flex:1 1 14rem}
.grow .gs{font-size:1.2rem;width:100%}
.lv{display:flex;align-items:center;gap:.5rem;font-size:1.4rem}
.lv .btn{min-height:3rem;padding:.1rem 1rem;font-size:1.5rem}
@media (max-width:560px){.ggrid{grid-template-columns:1fr}.gbtn{flex-direction:row;justify-content:flex-start;gap:.9rem;min-height:5.5rem;padding:.6rem 1rem;text-align:left;flex-wrap:wrap}.gbtn .gi{font-size:2.4rem}}
body.alarm{background:#b9f0b0;animation:alarmbg 1s infinite alternate}@keyframes alarmbg{to{background:#fff3a0}}
#restgo.pulse{animation:pulse .8s infinite;font-size:2.2rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}body.alarm,#restgo.pulse{animation:none!important}}
</style>
</head>
<body>

<section id="menu" class="screen on">
  <h1>脳トレ<span>広場</span></h1>
  <p class="sub">まちがえても大丈夫。楽しく、ゆっくり。</p>
  <button class="btn go" id="course">▶ 今日の1時間コース<small>12ステージ・休けい入り（いつでも やめられます）</small></button>
  <p class="sub">すきなゲームを えらぶ</p>
  <div class="ggrid" id="ggrid"></div>
  <div class="row">
    <button class="btn" id="logbtn">きろく・せってい</button>
    <button class="btn" id="voicebtn">🔊 声 ON</button>
    <button class="btn" id="bgmbtn">♪ BGM ON</button>
    <button class="btn" id="sndbtn">🔔 効果音 ON</button>
    <button class="btn" id="fsbtn">文字 大</button>
  </div>
</section>

<section id="play" class="screen">
  <div class="hud"><span class="count" id="count"></span><div class="bar"><i id="prog"></i></div><button class="btn" id="hear">🔊 きく</button><button class="btn" id="quit">やめる</button></div>
  <p id="title"></p>
  <p id="msg"></p>
  <div id="stage"></div>
</section>

<section id="result" class="screen" style="justify-content:center">
  <p class="stars" id="stars"></p>
  <p class="big" id="rscore"></p>
  <p class="mid" id="rnote"></p>
  <p class="mid" id="rcourse"></p>
  <div class="row">
    <button class="btn go" id="rnext" style="width:auto">次へ</button>
    <button class="btn" id="rhome">メニュー</button>
  </div>
</section>

<section id="rest" class="screen" style="justify-content:center">
  <p class="big" id="resttitle"></p>
  <p class="mid" id="resttext"></p>
  <p class="stars" id="restcount" style="font-size:3rem;color:var(--pri);text-shadow:none"></p>
  <button class="btn go" id="restgo" style="width:auto"></button>
</section>

<section id="log" class="screen">
  <p class="big">きろく・せってい</p>
  <div id="logbody" style="width:100%;display:flex;flex-direction:column;gap:.9rem"></div>
  <div class="row" id="resetrow"><button class="btn" id="resetbtn">きろくを消す</button></div>
  <div id="resetask" style="display:none;text-align:center"><p class="mid">きろくと むずかしさが、さいしょに戻ります。よろしいですか？</p><div class="row"><button class="btn" id="resetyes">消す</button><button class="btn" id="resetno">やめる</button></div></div>
  <button class="btn" id="logback">メニューへ</button>
</section>

<div id="flash">○</div>

<script>

  function load(){
    try { var s = localStorage.getItem(KEY); if (s){ var o = JSON.parse(s); if (o && o.lv) return o; } } catch(e){}
    return { lv:{}, log:[], fs:1, snd:1 };

  var S = load();

  if (S.bgm == null) S.bgm = 1;

  function getLv(id){ return S.lv[id] || 1; }

  /* ---------- 音（やさしい音だけ） ---------- */
  var AC = null;
  function ac(){
    if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
    if (AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  function tone(f, t0, d, vol, type){
    if (!S.snd) return; var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type || "sine"; o.frequency.value = f;

  }

  function sDone(){ [523,659,784,1047].forEach(function(f,i){ tone(f,i*.15,.6,.22); }); }

    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + .02;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + .2);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(bgmG); o.start(t); o.stop(t + d + .05);
  }
  function bgmTick(){

    if (Math.random() < (calm ? .45 : .65)){
      bgmIdx = Math.max(0, Math.min(PENT.length - 1, bgmIdx + rnd(-2, 2)));
      bt(PENT[bgmIdx] * (calm ? .5 : 1), 1.4, calm ? .07 : .09, "triangle");
    }
    bgmStep++;
  }

  function fmt(h, m){ return h + "時" + (m === 0 ? "ちょうど" : m + "分"); }
  function clockSvg(h, m){
    var ha = (h % 12) * 30 + m * .5, ma = m * 6, i, s = '<svg class="clock" viewBox="0 0 300 300"><circle cx="150" cy="150" r="144" fill="#fff" stroke="#17202a" stroke-width="8"/>';
    for (i=0;i<60;i++){ var a = i*6*Math.PI/180, r1 = i%5 ? 134 : 124; s += '<line x1="'+(150+Math.sin(a)*r1)+'" y1="'+(150-Math.cos(a)*r1)+'" x2="'+(150+Math.sin(a)*138)+'" y2="'+(150-Math.cos(a)*138)+'" stroke="#17202a" stroke-width="'+(i%5?2:5)+'"/>'; }
    for (i=1;i<=12;i++){ var b = i*30*Math.PI/180; s += '<text x="'+(150+Math.sin(b)*104)+'" y="'+(150-Math.cos(b)*104+13)+'" font-size="38" font-weight="900" text-anchor="middle" fill="#17202a" font-family="sans-serif">'+i+'</text>'; }
    s += '<g transform="rotate('+ha+' 150 150)"><line x1="150" y1="160" x2="150" y2="82" stroke="#17202a" stroke-width="14" stroke-linecap="round"/></g>';
    s += '<g transform="rotate('+ma+' 150 150)"><line x1="150" y1="165" x2="150" y2="38" stroke="#d84315" stroke-width="9" stroke-linecap="round"/></g>';
    return s + '<circle cx="150" cy="150" r="10" fill="#17202a"/></svg>';
  }
  GAMES.push({ id:"clock", icon:"🕐", name:"時計を読もう", desc:"何時何分かな？", up:.9, down:.7,
  start:function(L, api){
    var trials = 8, ti = 0, lastT = "";
    api.prog(0, trials);
    function opts(h, m){
      var c = fmt(h, m), cand = [[h%12+1, m], [(h+10)%12+1, m]];
      if (L >= 2) cand.push([h, (m+30)%60]);
      if (L >= 3) cand.push([h, (m+15)%60], [h, (m+45)%60], [(m/5) || 12, (h%12)*5]);
      if (L >= 4) cand.push([h, (m+5)%60], [h, (m+55)%60]);
      var out = [c];
      shuffle(cand).forEach(function(x){ var t = fmt(x[0], x[1]); if (out.length < 4 && out.indexOf(t) < 0) out.push(t); });
      while (out.length < 4){ var t = fmt(rnd(1,12), m); if (out.indexOf(t) < 0) out.push(t); }
      return shuffle(out);
    }
    function trial(){
      var h, m, t, ms = L === 1 ? [0] : L === 2 ? [0,30] : L === 3 ? [0,15,30,45] : [0,5,10,15,20,25,30,35,40,45,50,55];
      do { h = rnd(1,12); m = pickOne(ms); t = fmt(h, m); } while (t === lastT); lastT = t;
      var st = api.stage, got = false; st.innerHTML = ""; api.msg("今は 何時でしょう？（短い針＝時、赤い長い針＝分）");
      var w = el("div"); w.innerHTML = clockSvg(h, m); st.appendChild(w); api.tap(w, "今は 何時でしょう？");
      var og = el("div", "opts");
      opts(h, m).forEach(function(o){
        var b = el("button", "opt", o);
        b.addEventListener("click", function(){
          if (got) return;
          if (o === t){ got = true; api.ok(); api.cheer(); ti++; api.prog(ti, trials); api.msg("正解です！"); b.style.background = "#c8e6c9";
            if (ti >= trials) api.later(api.done, 1000); else api.later(trial, 1000); }
          else { api.ng("時計は「" + t + "」なのに「" + o + "」と答えた"); api.oops(); b.classList.add("miss"); api.msg("おしい！もう一度"); }
        });
        og.appendChild(b);
      });
      st.appendChild(og);
    }
    trial();
  }});

  /* 7. 色と文字（抑制・切りかえ） */
  var COL = [{n:"あか",c:"#ff4d4d"},{n:"あお",c:"#4aa3ff"},{n:"きいろ",c:"#ffd600"},{n:"みどり",c:"#3ddc5a"}];
  GAMES.push({ id:"color", icon:"🎨", name:"色と文字", desc:"まどわされずに えらぼう", up:.9, down:.7,
  start:function(L, api){
    var trials = 10, ti = 0;
    api.prog(0, trials);
    function trial(){
      var wi = rnd(0,3), ii = rnd(0,3);
      if (L >= 3) while (ii === wi) ii = rnd(0,3);
      var task = (L === 5 && Math.random() < .5) ? "read" : "color", ans = task === "read" ? wi : ii, got = false;
      var st = api.stage; st.innerHTML = "";
      var cue = el("div", "cue " + (L === 5 ? (task === "read" ? "r" : "c") : ""), L <= 2 ? "この色は？" : (L <= 4 ? "文字の「色」は？" : (task === "read" ? "文字を「読んで」えらぶ" : "文字の「色」をえらぶ")));
      st.appendChild(cue); api.hear(cue.textContent); api.tap(cue, cue.textContent);
      var pn = el("div", "panel");
      if (L <= 2){ var bk = el("div", "blk"); bk.style.background = COL[ii].c; pn.appendChild(bk); }
      else { var wd = el("div", "word", COL[wi].n); wd.style.color = COL[ii].c; pn.appendChild(wd); }
      st.appendChild(pn); api.tap(pn, cue.textContent);
      var idx = [0,1,2,3];
      if (L === 1 || L === 3){ var other = L === 3 ? (ans === ii ? wi : ii) : pickOne(idx.filter(function(x){ return x !== ans; })); idx = [ans, other]; }
      var og = el("div", "opts");
      shuffle(idx).forEach(function(k){
        var b = el("button", "opt");
        if (L === 1){ var sw = el("span", "sw"); sw.style.background = COL[k].c; b.appendChild(sw); }
        b.appendChild(document.createTextNode(COL[k].n));
        b.addEventListener("click", function(){
          if (got) return;
          if (k === ans){ got = true; api.ok(); api.cheer(); ti++; api.prog(ti, trials); b.style.background = "#c8e6c9";
            if (ti >= trials) api.later(api.done, 900); else api.later(trial, 900); }
          else { api.ng((L <= 2 ? "色ブロック（" + COL[ii].n + "）" : "文字「" + COL[wi].n + "」を" + COL[ii].n + "色で表示") + "。「" + COL[k].n + "」を選んだ（正解は「" + COL[ans].n + "」" + (L === 5 ? "、指示：" + (task === "read" ? "読み" : "色") : "") + "）"); api.oops(); b.classList.add("miss"); api.msg("おしい！もう一度"); }
        });
        og.appendChild(b);
      });
      st.appendChild(og);
    }
    trial();
  }});

  /* ---------- メニュー ---------- */
  function dots(n){ return "●".repeat(n) + "○".repeat(5 - n); }
  function renderMenu(){
    var g = $("ggrid"); g.innerHTML = "";
    GAMES.forEach(function(x){
      var b = el("button", "gbtn");
      b.appendChild(el("span", "gi", x.icon));
      var d = el("span", ""); d.style.display = "flex"; d.style.flexDirection = "column"; d.style.alignItems = "inherit"; d.style.gap = ".1rem";
      d.appendChild(el("span", "gn", x.name)); d.appendChild(el("span", "gd", x.desc)); d.appendChild(el("span", "gl", "むずかしさ " + dots(getLv(x.id))));
      b.appendChild(d);
      b.addEventListener("click", function(){ course = null; startRound(x); });
      g.appendChild(b);
    });
    $("sndbtn").textContent = S.snd ? "🔔 効果音 ON" : "🔔 効果音 OFF";
    $("voicebtn").textContent = S.voice ? "🔊 声 ON" : "🔊 声 OFF";
    $("bgmbtn").textContent = S.bgm ? "♪ BGM ON" : "♪ BGM OFF";
    $("fsbtn").textContent = "文字 " + ["ふつう","大","特大"][S.fs];
    document.documentElement.className = "fs" + S.fs;
  }
  $("sndbtn").addEventListener("click", function(){ S.snd = S.snd ? 0 : 1; save(); renderMenu(); });
  $("voicebtn").addEventListener("click", function(){ S.voice = S.voice ? 0 : 1; save(); renderMenu(); if (S.voice) speak("声を出します"); else { try { speechSynthesis.cancel(); } catch(e){} } });
  $("bgmbtn").addEventListener("click", function(){ S.bgm = S.bgm ? 0 : 1; save(); renderMenu(); bgmRunning = "x"; applyBgm(); });
  function replay(){ if (cur) speak(cur.heard || "", true); }
  $("hear").addEventListener("click", replay);
  $("msg").addEventListener("click", replay);
  $("fsbtn").addEventListener("click", function(){ S.fs = (S.fs + 1) % 3; save(); renderMenu(); });

  /* ---------- きろく ---------- */
  var WD = ["日","月","火","水","木","金","土"];
  function dayKey(t){ var d = new Date(t); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
  function mins(sec){ return (sec ? Math.max(1, Math.round(sec/60)) : 0) + "分"; }
  function pct(ok, ng){ return (ok + ng) ? Math.round(ok/(ok+ng)*100) + "%" : "―"; }
  function lcard(h, t){ var c = el("div", "lcard"); c.appendChild(el("div", "lh", h)); if (t != null) c.appendChild(el("div", "lt", t)); return c; }
  function renderLog(){
    var box = $("logbody"); box.innerHTML = "";
    var days = {}, order = [];
    S.log.forEach(function(e){
      var k = dayKey(e.t);
      if (!days[k]){ days[k] = { t:e.t, sec:0, ok:0, ng:0 }; order.push(k); }
      var d = days[k]; d.sec += e.sec; d.ok += e.ok; d.ng += e.ng;
    });
    var td = days[dayKey(Date.now())] || { sec:0, ok:0, ng:0 };
    box.appendChild(lcard("きょうの練習", mins(td.sec) + "　正解率 " + pct(td.ok, td.ng)));
    box.appendChild(lcard("練習した日", order.length + "日"));
    var dc = lcard("ここ最近の練習時間"), recent = order.slice(-7).reverse(), mx = 1;
    recent.forEach(function(k){ mx = Math.max(mx, days[k].sec); });
    if (!recent.length) dc.appendChild(el("div", "lt", "まだ記録がありません"));
    recent.forEach(function(k){
      var d = days[k], dt = new Date(d.t), r = el("div", "drow");
      r.appendChild(el("span", "dd", (dt.getMonth()+1) + "/" + dt.getDate() + "（" + WD[dt.getDay()] + "）"));
      var bar = el("span", "db"); bar.style.width = Math.max(6, d.sec/mx*40) + "%"; r.appendChild(bar);
      r.appendChild(el("span", "dm", mins(d.sec)));
      dc.appendChild(r);
    });
    box.appendChild(dc);
    var gc = lcard("ゲームごとのむずかしさ（家族の方が調整できます）");
    GAMES.forEach(function(x){
      var rows = S.log.filter(function(e){ return e.g === x.id; }), last = rows.slice(-5), ok = 0, ng = 0;
      last.forEach(function(e){ ok += e.ok; ng += e.ng; });
      var r = el("div", "grow"); r.appendChild(el("div", "gt", x.icon + " " + x.name));
      var lv = el("div", "lv"), mn = el("button", "btn", "−"), pl = el("button", "btn", "＋");
      var lt = el("span", "", "Lv " + getLv(x.id));
      mn.addEventListener("click", function(){ if (getLv(x.id) > 1){ S.lv[x.id] = getLv(x.id) - 1; save(); renderLog(); } });
      pl.addEventListener("click", function(){ if (getLv(x.id) < 5){ S.lv[x.id] = getLv(x.id) + 1; save(); renderLog(); } });
      lv.appendChild(mn); lv.appendChild(lt); lv.appendChild(pl); r.appendChild(lv);
      r.appendChild(el("div", "gs", "あそんだ回数 " + rows.length + "回　最近の正解率 " + pct(ok, ng)));
      gc.appendChild(r);
    });
    box.appendChild(gc);
    var mc = lcard("まちがえた内容（新しい順・最新100件）"), cnt = 0;
    for (var i = S.log.length - 1; i >= 0 && cnt < 100; i--){
      var e = S.log[i]; if (!e.miss || !e.miss.length) continue;
      var gm = gameById(e.g), dt = new Date(e.t);
      var hd = (dt.getMonth()+1) + "/" + dt.getDate() + " " + dt.getHours() + ":" + ("0" + dt.getMinutes()).slice(-2) + "　" + (gm ? gm.name : e.g) + "（Lv" + (e.lv || "?") + "）";
      for (var j = 0; j < e.miss.length && cnt < 100; j++, cnt++){
        var row = el("div", "mrow"), bb = el("b", "", hd); row.appendChild(bb); row.appendChild(document.createTextNode("　" + e.miss[j])); mc.appendChild(row);
      }
    }
    if (!cnt) mc.appendChild(el("div", "mrow", "まだありません（これから記録されます）"));
    box.appendChild(mc);
  }
  function resetUi(ask){ $("resetask").style.display = ask ? "" : "none"; $("resetrow").style.display = ask ? "none" : ""; }
  $("logbtn").addEventListener("click", function(){ renderLog(); resetUi(false); show("log"); });
  $("logback").addEventListener("click", function(){ renderMenu(); show("menu"); });
  $("resetbtn").addEventListener("click", function(){ resetUi(true); });
  $("resetno").addEventListener("click", function(){ resetUi(false); });
  $("resetyes").addEventListener("click", function(){ S.lv = {}; S.log = []; save(); resetUi(false); renderLog(); });

  renderMenu();
})();
</script>
</body>
