<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<title>脳トレ広場 オセロ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@700&display=swap">
<style>
:root{--ink:#17202a;--panel:#ffffff;--pri:#14607a;--acc:#f08a24;--ok:#2e7d32;
  --ui:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(var(--k,1) * clamp(18px,min(3.7vw,3.1vh),40px))}
html.fs0{--k:.9}
html.fs2{--k:1.3}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,#d7eefa 0%,#fdf6df 55%,#e6f2c8 100%);background-attachment:fixed;
  color:var(--ink);font-family:var(--ui);font-weight:700;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow-x:hidden;overscroll-behavior:none}
button{font-family:var(--ui);font-weight:900;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
.screen{display:none;min-height:100dvh;padding:.4rem .5rem .5rem;max-width:1400px;margin:0 auto;flex-direction:column;align-items:center;justify-content:center;gap:.35rem}
.screen.on{display:flex}
h1{font-size:3.2rem;margin:.4rem 0 0;color:#23506b;letter-spacing:.05em;text-align:center}
h1 span{color:#e8742a}
.sub{font-size:1.4rem;margin:0;text-align:center}
.btn{background:var(--panel);border:4px solid var(--pri);border-radius:1.2rem;font-size:1.3rem;padding:.4rem 1rem;min-height:3.2rem}
.btn{white-space:nowrap}
.btn:active{filter:brightness(.93)}
.btn.off{background:#e3e7ea;border-color:#8aa4b3;color:#59666f}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.ggrid{width:100%;max-width:720px;display:grid;grid-template-columns:1fr;gap:.8rem}
.gbtn{background:var(--panel);border:4px solid var(--pri);border-radius:1.3rem;padding:.7rem .5rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-height:6rem;justify-content:center}
.gbtn .gi{font-size:1.2rem;line-height:1.2;color:#a85d00}
.gbtn .gn{font-size:1.8rem}
.gbtn .gd{font-size:1.1rem;font-weight:700}
.gbtn .gl{font-size:1.15rem;color:var(--pri)}
.gbtn:active{filter:brightness(.93)}
.gbtn.auto{background:#fff4d6;border-color:#c77a12;min-height:8.5rem}
.gbtn.auto .gl{color:#a85d00}
.link{background:none;border:none;text-decoration:underline;font-size:1.1rem;color:#4a5a66;padding:.3rem}
/* play */
.hud{width:100%;display:flex;align-items:center;gap:.6rem;justify-content:space-between}
.hud .btn{min-height:3rem;font-size:1.15rem;padding:.2rem .8rem}
.lvname{font-size:1.6rem;color:#23506b}
.score{width:100%;max-width:640px;display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.sc{display:flex;align-items:center;justify-content:center;gap:.5rem;background:#fff;border:4px solid #8aa4b3;border-radius:1.1rem;padding:.2rem .4rem;font-size:1.3rem;line-height:1.2}
.sc.turn{border-color:var(--acc);background:#fff1d6;box-shadow:0 0 0 4px rgba(240,138,36,.35)}
.sc .dot{width:1.7rem;height:1.7rem;border-radius:50%;flex:none}
.sc .dot.b{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}
.sc .dot.w{background:radial-gradient(circle at 35% 30%,#fff,#d8d8d8 65%,#aaa);border:1px solid #999}
.sc b{font-size:2rem;min-width:2.2rem;text-align:center}
.sc small{display:block;font-size:.95rem;font-weight:700}
#msg{min-height:3rem;font-size:1.3rem;text-align:center;margin:0;line-height:1.35;width:100%;max-width:900px}
#msg em{font-style:normal;color:#c2410c}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.top .btn{min-height:3rem;font-size:1.15rem;padding:.2rem .8rem}
.mini{display:flex;gap:.4rem}
.mini .sc{font-size:1rem;padding:.1rem .7rem;gap:.5rem;border-width:3px;white-space:nowrap}
.mini .sc .dot{width:1.8rem;height:1.8rem}
.mini .sc b{font-size:2rem;min-width:2.2rem}
.card.scroll{max-height:94dvh;overflow:auto}
.card.scroll .btn{font-size:1.2rem}
.gh{width:100%;margin:.2rem 0 0;text-align:left;font-size:1.05rem;color:#4a5a66}
.g2{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.dbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;line-height:1.2;min-height:4.4rem}
.dbtn small{font-size:.85rem;font-weight:700;color:var(--pri);min-height:1.05rem}
.dbtn.cur{background:#fff4d6;border-color:#c77a12}
:root{--cs:min(calc((100vw - 1rem - 14px)/8.5),calc((100dvh - 9.5rem - 14px)/8.5),130px)}
.bwrap{display:grid;grid-template-columns:calc(var(--cs)*.55) repeat(8,var(--cs));grid-template-rows:calc(var(--cs)*.55) repeat(8,var(--cs));
  background:#14573a;padding:6px;border-radius:14px;box-shadow:0 .3rem 0 rgba(0,0,0,.25)}
.lb{display:flex;align-items:center;justify-content:center;color:#e8f5e9;font-size:calc(var(--cs)*.38)}
.cell{position:relative;background:#2e9b5f;border:1px solid #14573a;padding:0;margin:0;border-radius:0}
.cell:disabled{cursor:default}
.st{position:absolute;inset:9%;border-radius:50%;display:none;pointer-events:none}
.st.b{display:block;background:radial-gradient(circle at 35% 30%,#707070,#111 60%);box-shadow:0 2px 4px rgba(0,0,0,.55)}
.st.w{display:block;background:radial-gradient(circle at 35% 30%,#fff,#dedede 65%,#a8a8a8);box-shadow:0 2px 4px rgba(0,0,0,.45)}
.st.drop{animation:drop .3s ease-out}
.st.flip{animation:flipx .4s}
@keyframes drop{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flipx{0%{transform:scaleX(1)}50%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
.cell.hint::after{content:"";position:absolute;inset:30%;border-radius:50%;background:rgba(255,226,122,.95);box-shadow:0 0 0 3px rgba(255,255,255,.55)}
@keyframes pls{50%{transform:scale(1.25)}}
.cell.last::before{content:"";position:absolute;inset:42%;border-radius:50%;background:#e53935;z-index:2;border:2px solid #fff}
.cell.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tools{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;width:100%}
.tools .btn{flex:1 1 auto;min-width:8rem}
.ov{position:fixed;inset:0;background:rgba(23,32,42,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:1rem}
.ov.on{display:flex}
.card{background:#fff;border:5px solid var(--pri);border-radius:1.6rem;padding:1.2rem 1.4rem;max-width:560px;width:100%;display:flex;flex-direction:column;gap:.8rem;align-items:center;text-align:center}
.card h2{margin:0;font-size:2.1rem;color:#23506b;white-space:nowrap}
.card h2.win{color:#c2410c}
.card .big{font-size:2rem}
.card p{margin:0;font-size:1.3rem;line-height:1.45}
.card .btn{width:100%;font-size:1.5rem}
.card .go{background:#ffb43c;border-color:#c77a12;box-shadow:0 .3rem 0 #c77a12}
.cf{position:fixed;top:-3rem;font-size:2.2rem;z-index:30;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.card h2.win{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.fine{font-size:.95rem;font-weight:700;color:#4a5a66;text-align:center;margin:0}
</style>
</head>
<body>

<!-- ========== ゲーム（これだけが常時表示） ========== -->
<section id="play" class="screen on">
  <div class="top">
    <button class="btn" id="setbtn">⚙ 設定変更</button>
    <div class="mini">
      <div class="sc" id="scB"><span class="dot b"></span><b id="nB">2</b></div>
      <div class="sc" id="scW"><span class="dot w"></span><b id="nW">2</b></div>
    </div>
  </div>
  <div class="bwrap" id="board"></div>
  <p id="msg"></p>
</section>

<!-- ========== 設定変更（ボタンを押したときだけ表示） ========== -->
<div class="ov" id="set">
  <div class="card scroll">
    <h2>設定変更</h2>
    <p class="gh">つよさ（えらぶと はじめから始まります）</p>
    <div class="g2">
      <button class="btn dbtn" data-mode="easy">🌱 初級<small id="rec-easy"></small></button>
      <button class="btn dbtn" data-mode="mid">🌿 中級<small id="rec-mid"></small></button>
      <button class="btn dbtn" data-mode="hard">🌳 上級<small id="rec-hard"></small></button>
      <button class="btn dbtn" data-mode="auto">✨ 自動<small id="rec-auto"></small></button>
    </div>
    <p class="fine">自動：あなたに合わせて強さが変わり、ギリギリ勝てる強さをめざします</p>
    <p class="gh">ゲーム</p>
    <div class="g2">
      <button class="btn" id="undo">一手もどす</button>
      <button class="btn" id="restart">はじめから</button>
      <button class="btn" id="again" style="grid-column:1/-1">🔊 「あなたの番です」を聞く</button>
    </div>
    <p class="gh">音・表示</p>
    <div class="g2">
      <button class="btn bgmbtn"></button>
      <button class="btn sebtn"></button>
      <button class="btn voicebtn"></button>
      <button class="btn" id="hintbtn"></button>
      <button class="btn fsbtn" style="grid-column:1/-1"></button>
    </div>
    <button class="btn go" id="setClose">とじて ゲームにもどる</button>
    <button class="link" id="resetAuto">自動の強さを はじめにもどす</button>
  </div>
</div>

<div class="ov" id="ov">
  <div class="card">
    <h2 id="ovT"></h2>
    <div class="big" id="ovS"></div>
    <p id="ovM"></p>
    <button class="btn go" id="ovAgain">もう一度 あそぶ</button>
    <button class="btn" id="ovView">盤面を見る</button>
    <button class="btn" id="ovMenu">設定変更（つよさ・音）</button>
  </div>
</div>

var AC = null, master = null, bgmGain = null;
function ac(){
  if (!AC){
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "playback" });
      master = AC.createGain(); master.gain.value = .9;
      var comp = AC.createDynamicsCompressor();
      master.connect(comp); comp.connect(AC.destination);
      bgmGain = AC.createGain(); bgmGain.gain.value = .45; bgmGain.connect(master);
    } catch(e){ AC = null; }
  }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
var noiseBuf = null;
function noise(){
  if (!noiseBuf){
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

function tone(f, t0, d, vol, type, f2){
  if (!S.se) return; var c = ac(); if (!c) return;
  var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
}
function click(t0, vol, freq, d){
  if (!S.se) return; var c = ac(); if (!c) return;
  var t = c.currentTime + t0, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = noise(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 1.2;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);

}

function speakP(t, o){
  return new Promise(function(res){
    if (!S.voice || !window.speechSynthesis || !t || !userActed){ res(); return; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = "ja-JP"; u.rate = (o && o.rate) || .9; u.pitch = (o && o.pitch) || 1;

}

      await say(t2, 1800); if (my !== gid) return; turn = 1; continue;
    }
    setMsg("コンピュータが 考えています…");
    await delay(S.voice ? 500 : 800); if (my !== gid) return;
    var lv = cpuLevel(), mvI = cpuPick(board, 2, lv);
    var fl = await doPlace(mvI, 2); if (my !== gid) return;
    var corner = isCorner(mvI) ? "角を取られました。" : "";
    setMsg("コンピュータは <em>" + posText(mvI) + "</em> に置きました。<br>黒が " + fl.length + "枚 ひっくり返りました");
    turn = 1;
  }
}

async function onCell(i){
  if (busy || over || turn !== 1) return;
  var fl = flipsOf(board, i, 1);
  if (!fl || !fl.length){
    sBad(); cells[i].classList.remove("bad"); void cells[i].offsetWidth; cells[i].classList.add("bad");
    var m = S.hint ? "そこには置けません。光っている場所を選んでください。" : "そこには置けません。相手の石をはさめる場所を選んでください。";
    setMsg("そこには 置けません"); return;
  }
  var my = gid; busy = true;
  hist.push({ b: new Int8Array(board), last: lastIdx });
  stopSpeech();
  var got = await doPlace(i, 1); if (my !== gid) return;
  var corner = isCorner(i) ? "角を取りました。" : "";
  var txt = posText(i) + "に置きました。白を" + got.length + "枚ひっくり返しました。" + corner;
  setMsg("あなたは <em>" + posText(i) + "</em> に置きました。<br>白を " + got.length + "枚 ひっくり返しました");
  turn = 2; render(false);
  step(my);
}

/* ---------- おわり ---------- */
async function finish(my){
  over = true; busy = true; render(false);
  var b = count(board, 1), w = count(board, 2), margin = b - w, res = margin > 0 ? "win" : margin < 0 ? "lose" : "draw";
  if (!recorded){
    recorded = true;
    var r = S.rec[mode] || [0, 0, 0]; r[res === "win" ? 0 : res === "lose" ? 1 : 2]++; S.rec[mode] = r;
  }
  var cmt = "", scmt = "";
  if (mode === "auto"){
    S.L = clamp(S.L + clamp((margin - 8) / 5, -1.5, 1.5) * .8, 1, 10);
    if (res === "win") cmt = margin <= 8 ? "ぎりぎりの 接戦でした！ ちょうど いい強さです。" : "お見事！ 大きく勝ちました。次は 少し強くなります。";
    else if (res === "lose") cmt = "おしい！ 次は 少し 手かげんします。";
    else cmt = "引き分けです。次は 少しだけ 手かげんします。";
    scmt = res === "win" ? (margin <= 8 ? "ぎりぎりの接戦でした。ちょうどいい強さです。" : "次は少し強くなります。") : "次は少し手かげんします。";
  } else {
    cmt = res === "win" ? "よくできました！" : res === "lose" ? "つぎは きっと 勝てます！" : "いい勝負でした！";
  }
  save();
  var title = res === "win" ? "🎉 あなたの勝ち！ 🎉" : res === "lose" ? "あなたの負け" : "引き分け";
  $("ovT").textContent = title; $("ovT").className = res === "win" ? "win" : "";
  $("ovS").textContent = "黒 " + b + "  対  白 " + w; $("ovM").textContent = cmt;
  setMsg("<em>" + title + "</em>　黒 " + b + " 対 白 " + w);
  if (res === "win") sWin(); else if (res === "lose") sLose(); else sDraw();
  var sp, vo;
  if (res === "win"){
    sp = "やったー！あなたの勝ちです！おめでとうございます！黒" + b + "対、白" + w + "で、" + (margin >= 20 ? "圧勝です！すごい！" : "すばらしい勝利でした！");
    vo = { pitch: 1.3, rate: 1.05 };
  } else if (res === "lose"){
    sp = "ああ、おしい！あなたの負けです。でも、とてもいい勝負でした。次はきっと勝てますよ！"; vo = { pitch: 1.1, rate: .95 };
  } else { sp = "引き分けです！いい勝負でした！"; vo = { pitch: 1.2, rate: 1 }; }
  if (mode === "auto") sp += scmt;
  lead = "";
  await delay(900); if (my !== gid) return;
  $("ov").classList.add("on");
  if (res === "win") confetti();
  if (S.voice) speakP(sp, vo);
}

async function newGame(initial){
  gid++; var my = gid; stopSpeech();
  board = new Int8Array(64); board[27] = 2; board[28] = 1; board[35] = 1; board[36] = 2;
  turn = 1; hist = []; over = false; busy = true; lastIdx = -1; lead = ""; recorded = false;
  $("ov").classList.remove("on"); render(false);
  var intro = "ゲームを始めます。あなたは黒です。先に打ってください。";
  setMsg("あなたは <em>黒</em> です。先に 打ってください");
  lead = intro;
  step(my);
}

/* ================= 設定変更 ================= */
function stars(L){ var n = clamp(Math.round(L / 2), 1, 5), s = ""; for (var i = 0; i < 5; i++) s += i < n ? "★" : "☆"; return s; }
function renderSettings(){
  ["easy", "mid", "hard", "auto"].forEach(function(m){
    var r = S.rec[m] || [0, 0, 0], t = (r[0] + r[1] + r[2]) ? (r[0] + "勝 " + r[1] + "敗" + (r[2] ? " " + r[2] + "分" : "")) : "";
    if (m === "auto") t = "いまの強さ " + stars(S.L) + (t ? "　" + t : "");
    $("rec-" + m).textContent = t;
  });
  document.querySelectorAll(".dbtn").forEach(function(b){ b.classList.toggle("cur", b.getAttribute("data-mode") === mode); });
  document.documentElement.classList.remove("fs0", "fs1", "fs2"); document.documentElement.classList.add("fs" + S.fs);
  document.querySelectorAll(".bgmbtn").forEach(function(b){ b.textContent = "♪ BGM " + (S.bgm ? "あり" : "なし"); b.classList.toggle("off", !S.bgm); });
  document.querySelectorAll(".sebtn").forEach(function(b){ b.textContent = "効果音 " + (S.se ? "あり" : "なし"); b.classList.toggle("off", !S.se); });
  document.querySelectorAll(".voicebtn").forEach(function(b){ b.textContent = "声 " + (S.voice ? "あり" : "なし"); b.classList.toggle("off", !S.voice); });
  document.querySelectorAll(".fsbtn").forEach(function(b){ b.textContent = "文字の大きさ：" + ["小", "中", "大"][S.fs]; });
  $("hintbtn").textContent = "ヒント " + (S.hint ? "あり" : "なし"); $("hintbtn").classList.toggle("off", !S.hint);
  $("undo").disabled = busy || over || hist.length === 0;
}
function openSet(){ renderSettings(); $("set").classList.add("on"); $("ov").classList.remove("on"); }
function closeSet(){ $("set").classList.remove("on"); if (!busy && !over && turn === 1) render(true); }

$("setbtn").addEventListener("click", openSet);
$("setClose").addEventListener("click", closeSet);
$("ovMenu").addEventListener("click", openSet);
document.querySelectorAll(".dbtn").forEach(function(b){
  b.addEventListener("click", function(){
    var m = b.getAttribute("data-mode"); $("set").classList.remove("on");
    if (m === mode && !over && hist.length === 0 && !recorded){ render(!busy && turn === 1); return; }
    mode = m; S.mode = m; save(); newGame();
  });
});
document.querySelectorAll(".bgmbtn").forEach(function(b){ b.addEventListener("click", function(){ S.bgm = S.bgm ? 0 : 1; save(); renderSettings(); if (S.bgm) startBgm(); else stopBgm(); }); });
document.querySelectorAll(".sebtn").forEach(function(b){ b.addEventListener("click", function(){ S.se = S.se ? 0 : 1; save(); renderSettings(); if (S.se) sPlace(); }); });
document.querySelectorAll(".voicebtn").forEach(function(b){ b.addEventListener("click", function(){
  S.voice = S.voice ? 0 : 1; save(); renderSettings();
  if (S.voice) speakP("声ありにしました。"); else stopSpeech(); }); });
document.querySelectorAll(".fsbtn").forEach(function(b){ b.addEventListener("click", function(){ S.fs = (S.fs + 1) % 3; save(); renderSettings(); }); });
$("hintbtn").addEventListener("click", function(){ S.hint = S.hint ? 0 : 1; save(); renderSettings(); });
$("resetAuto").addEventListener("click", function(){
  S.L = 1; save(); renderSettings(); sPass();
  var el = $("resetAuto"); el.textContent = "✔ 自動の強さを ★☆☆☆☆ にもどしました"; el.style.color = "#2e7d32";
  setTimeout(function(){ el.textContent = "自動の強さを はじめにもどす"; el.style.color = ""; }, 2500);
});
$("again").addEventListener("click", function(){
  closeSet();
  var was = S.voice; S.voice = 1; speakP(TURN_SAY).then(function(){ S.voice = was; });
});
$("restart").addEventListener("click", function(){ $("set").classList.remove("on"); newGame(); });
$("undo").addEventListener("click", function(){
  if (busy || over || !hist.length) return; $("set").classList.remove("on");
  var h = hist.pop(); board = h.b; lastIdx = h.last; turn = 1; lead = ""; stopSpeech();
  render(true); setMsg("一手 もどしました。<br><em>あなたの番です</em>");
  lastSpeech = TURN_SAY; if (S.voice) speakP("一手もどしました。" + TURN_SAY);
});
$("ovAgain").addEventListener("click", function(){ newGame(); });
$("ovView").addEventListener("click", function(){ $("ov").classList.remove("on"); });

document.addEventListener("pointerdown", function(){ userActed = true; ac(); unlockSpeech(); startBgm(); });
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ stopSpeech(); if (AC) AC.suspend(); } else if (AC && AC.state === "suspended"){ AC.resume(); }
});

if (S.mode && MODES[S.mode]) mode = S.mode;
buildBoard(); renderSettings(); prepBgm(); newGame(true); if (S.bgm) setTimeout(renderBgm, 400);
window.__oth = { get board(){ return board; }, get turn(){ return turn; }, get over(){ return over; }, get S(){ return S; }, get M(){ return M; }, get buf(){ return bgmArr; }, get failed(){ return renderFailed; },
  cpuPick: cpuPick, movesOf: movesOf, onCell: onCell, parse: function(){ return parseMidi(b64buf(MIDI_B64)); } };
})();
</script>
